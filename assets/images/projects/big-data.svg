<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Abstract illustration for the Big Data Processing project">
  <defs>
    <linearGradient id="bd-bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset=".55" stop-color="#101827"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="bd-bar" x1="0" y1="750" x2="0" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bd-line" x1="120" y1="520" x2="1080" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="bd-glow" cx="50%" cy="55%" r="55%">
      <stop stop-color="#2563EB" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bd-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#94A3B8" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bd-bg)"/>
  <rect width="1200" height="750" fill="url(#bd-grid)"/>
  <rect width="1200" height="750" fill="url(#bd-glow)"/>
  <g opacity=".85">
    <rect x="150" y="430" width="62" height="170" rx="10" fill="url(#bd-bar)" opacity=".35"/>
    <rect x="244" y="360" width="62" height="240" rx="10" fill="url(#bd-bar)" opacity=".5"/>
    <rect x="338" y="470" width="62" height="130" rx="10" fill="url(#bd-bar)" opacity=".3"/>
    <rect x="432" y="290" width="62" height="310" rx="10" fill="url(#bd-bar)" opacity=".7"/>
    <rect x="526" y="390" width="62" height="210" rx="10" fill="url(#bd-bar)" opacity=".45"/>
    <rect x="620" y="230" width="62" height="370" rx="10" fill="url(#bd-bar)" opacity=".85"/>
    <rect x="714" y="330" width="62" height="270" rx="10" fill="url(#bd-bar)" opacity=".55"/>
    <rect x="808" y="180" width="62" height="420" rx="10" fill="url(#bd-bar)"/>
    <rect x="902" y="300" width="62" height="300" rx="10" fill="url(#bd-bar)" opacity=".65"/>
    <rect x="996" y="410" width="62" height="190" rx="10" fill="url(#bd-bar)" opacity=".4"/>
  </g>
  <path d="M150 520c70-70 130-30 194-92 74-72 116-30 186-84 76-58 128-18 208-96 66-64 128-38 214-86" fill="none" stroke="url(#bd-line)" stroke-width="3"/>
  <g fill="#06B6D4">
    <circle cx="344" cy="428" r="7"/><circle cx="530" cy="344" r="7"/><circle cx="902" cy="230" r="7"/>
  </g>
  <g font-family="'JetBrains Mono', 'Consolas', monospace" fill="#94A3B8" font-size="15" letter-spacing="3">
    <text x="150" y="120">DATASET / 01</text>
    <text x="150" y="150" fill="#F8FAFC" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="38" font-weight="700" letter-spacing="1">BIG DATA</text>
    <text x="150" y="186" fill="#60A5FA" font-size="16">PANDAS × PYSPARK</text>
    <text x="1050" y="680" text-anchor="end">PROCESS · TRANSFORM · ANALYZE</text>
  </g>
  <rect x="149" y="658" width="54" height="3" rx="1.5" fill="#2563EB"/>
  <rect x="211" y="658" width="18" height="3" rx="1.5" fill="#06B6D4"/>
