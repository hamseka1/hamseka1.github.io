<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Abstract illustration for the Laravel web framework experiment">
  <defs>
    <linearGradient id="lv-bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset=".55" stop-color="#101827"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="lv-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF2D20"/>
      <stop offset="1" stop-color="#F64A4A"/>
    </linearGradient>
    <radialGradient id="lv-glow" cx="50%" cy="45%" r="55%">
      <stop stop-color="#FF2D20" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FF2D20" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lv-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#94A3B8" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#lv-bg)"/>
  <rect width="1200" height="750" fill="url(#lv-grid)"/>
  <rect width="1200" height="750" fill="url(#lv-glow)"/>
  <g opacity=".9">
    <!-- Browser window -->
    <rect x="214" y="150" width="772" height="450" rx="26" fill="#0B1220" stroke="#94A3B8" stroke-opacity=".16"/>
    <rect x="214" y="150" width="772" height="52" rx="26" fill="#101827"/>
    <rect x="214" y="178" width="772" height="24" fill="#101827"/>
    <circle cx="252" cy="176" r="6" fill="#F87171" opacity=".7"/>
    <circle cx="274" cy="176" r="6" fill="#FBBF24" opacity=".7"/>
    <circle cx="296" cy="176" r="6" fill="#34D399" opacity=".7"/>
    <!-- Laravel "L" abstract mark -->
    <path d="M460 340h120v120H460z" fill="url(#lv-accent)" opacity=".9"/>
    <path d="M460 460h120v40H460z" fill="url(#lv-accent)" opacity=".8"/>
    <!-- Code lines -->
    <rect x="340" y="240" width="280" height="14" rx="7" fill="#F8FAFC" opacity=".85"/>
    <rect x="340" y="270" width="200" height="12" rx="6" fill="url(#lv-accent)"/>
    <rect x="340" y="300" width="260" height="8" rx="4" fill="#94A3B8" opacity=".25"/>
    <rect x="340" y="318" width="190" height="7" rx="3.5" fill="#94A3B8" opacity=".18"/>
    <rect x="340" y="354" width="120" height="32" rx="16" fill="url(#lv-accent)"/>
    <rect x="474" y="354" width="120" height="32" rx="16" fill="none" stroke="#94A3B8" stroke-opacity=".3"/>
    <!-- Route / blade snippets -->
    <rect x="620" y="236" width="318" height="150" rx="18" fill="#101827" stroke="#94A3B8" stroke-opacity=".12"/>
    <circle cx="698" cy="310" r="44" fill="none" stroke="url(#lv-accent)" stroke-width="2"/>
    <path d="M678 292h12v22h24v-22h12v48h-12v-16h-24v16h-12v-48Z" fill="url(#lv-accent)"/>
    <rect x="768" y="278" width="126" height="10" rx="5" fill="#F8FAFC" opacity=".6"/>
    <rect x="768" y="300" width="96" height="8" rx="4" fill="#94A3B8" opacity=".25"/>
    <rect x="768" y="320" width="112" height="8" rx="4" fill="#94A3B8" opacity=".18"/>
    <rect x="620" y="408" width="150" height="126" rx="16" fill="#101827" stroke="#94A3B8" stroke-opacity=".12"/>
    <rect x="780" y="408" width="150" height="126" rx="16" fill="#101827" stroke="#94A3B8" stroke-opacity=".12"/>
    <rect x="644" y="434" width="70" height="8" rx="4" fill="#60A5FA" opacity=".7"/>
    <rect x="644" y="454" width="102" height="7" rx="3.5" fill="#94A3B8" opacity=".2"/>
    <rect x="644" y="470" width="84" height="7" rx="3.5" fill="#94A3B8" opacity=".15"/>
    <rect x="804" y="434" width="70" height="8" rx="4" fill="#06B6D4" opacity=".7"/>
    <rect x="804" y="454" width="102" height="7" rx="3.5" fill="#94A3B8" opacity=".2"/>
    <rect x="804" y="470" width="84" height="7" rx="3.5" fill="#94A3B8" opacity=".15"/>
  </g>
  <g font-family="'JetBrains Mono', 'Consolas', monospace" fill="#94A3B8" font-size="15" letter-spacing="3">
    <text x="150" y="650">BUILD / 05</text>
    <text x="150" y="684" fill="#F8FAFC" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="1">LARAVEL WEB APP</text>
    <text x="1050" y="684" text-anchor="end" fill="#FF2D20">PHP FRAMEWORK</text>
  </g>
  <rect x="149" y="708" width="54" height="3" rx="1.5" fill="#2563EB"/>
  <rect x="211" y="708" width="18" height="3" rx="1.5" fill="#06B6D4"/>
</svg>
