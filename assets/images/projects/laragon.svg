<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Abstract illustration for the Laragon local development environment experiment">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset=".55" stop-color="#101827"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="lg-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="lg-glow" cx="50%" cy="45%" r="55%">
      <stop stop-color="#6366F1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lg-grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0v50" fill="none" stroke="#94A3B8" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#lg-bg)"/>
  <rect width="1200" height="750" fill="url(#lg-grid)"/>
  <rect width="1200" height="750" fill="url(#lg-glow)"/>
  <g opacity=".9">
    <!-- Terminal window -->
    <rect x="214" y="150" width="772" height="450" rx="26" fill="#0B1220" stroke="#94A3B8" stroke-opacity=".16"/>
    <rect x="214" y="150" width="772" height="52" rx="26" fill="#101827"/>
    <rect x="214" y="178" width="772" height="24" fill="#101827"/>
    <circle cx="252" cy="176" r="6" fill="#F87171" opacity=".7"/>
    <circle cx="274" cy="176" r="6" fill="#FBBF24" opacity=".7"/>
    <circle cx="296" cy="176" r="6" fill="#34D399" opacity=".7"/>
    <!-- Terminal prompt -->
    <rect x="252" y="260" width="340" height="20" rx="10" fill="#101827"/>
    <circle cx="266" cy="270" r="4" fill="#F87171" opacity=".8"/>
    <circle cx="282" cy="270" r="4" fill="#FBBF24" opacity=".8"/>
    <circle cx="298" cy="270" r="4" fill="#34D399" opacity=".8"/>
    <text x="314" y="275" fill="#F8FAFC" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">C:\laragon\www&gt;</text>
    <text x="430" y="275" fill="#60A5FA" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13">laragon start</text>
    <!-- Local server cards -->
    <rect x="340" y="320" width="260" height="140" rx="16" fill="#101827" stroke="#94A3B8" stroke-opacity=".12"/>
    <rect x="340" y="320" width="260" height="38" rx="16" fill="#161B26"/>
    <circle cx="378" cy="339" r="4" fill="#F87171" opacity=".7"/>
    <circle cx="400" cy="339" r="4" fill="#FBBF24" opacity=".7"/>
    <circle cx="422" cy="339" r="4" fill="#34D399" opacity=".7"/>
    <text x="370" y="380" fill="#F8FAFC" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14">Apache</text>
    <text x="370" y="406" fill="#94A3B8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12">localhost:80</text>
    <rect x="340" y="462" width="118" height="32" rx="12" fill="url(#lg-accent)"/>
    <rect x="472" y="462" width="118" height="32" rx="12" fill="none" stroke="#94A3B8" stroke-opacity=".3"/>
    <rect x="630" y="320" width="260" height="140" rx="16" fill="#101827" stroke="#94A3B8" stroke-opacity=".12"/>
    <rect x="630" y="320" width="260" height="38" rx="16" fill="#161B26"/>
    <circle cx="668" cy="339" r="4" fill="#F87171" opacity=".7"/>
    <circle cx="690" cy="339" r="4" fill="#FBBF24" opacity=".7"/>
    <circle cx="712" cy="339" r="4" fill="#34D399" opacity=".7"/>
    <text x="660" y="380" fill="#F8FAFC" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14">MySQL</text>
    <text x="660" y="406" fill="#94A3B8" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12">localhost:3306</text>
    <rect x="630" y="462" width="118" height="32" rx="12" fill="url(#lg-accent)"/>
    <rect x="762" y="462" width="118" height="32" rx="12" fill="none" stroke="#94A3B8" stroke-opacity=".3"/>
    <!-- Connection line -->
    <line x1="470" y1="390" x2="630" y2="390" stroke="#6366F1" stroke-width="2" stroke-opacity=".35"/>
    <circle cx="470" cy="390" r="4" fill="#6366F1"/>
    <circle cx="630" cy="390" r="4" fill="#6366F1"/>
    <!-- PHP badge -->
    <rect x="620" y="574" width="130" height="40" rx="20" fill="#101827" stroke="#94A3B8" stroke-opacity=".12"/>
    <text x="685" y="600" fill="#6366F1" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle">PHP</text>
  </g>
  <g font-family="'JetBrains Mono', 'Consolas', monospace" fill="#94A3B8" font-size="15" letter-spacing="3">
    <text x="150" y="650">BUILD / 06</text>
    <text x="150" y="684" fill="#F8FAFC" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="1">LARAGON LOCAL DEV</text>
    <text x="1050" y="684" text-anchor="end" fill="#6366F1">DEVELOPMENT ENV</text>
  </g>
  <rect x="149" y="708" width="54" height="3" rx="1.5" fill="#2563EB"/>
  <rect x="211" y="708" width="18" height="3" rx="1.5" fill="#06B6D4"/>
</svg>
